name: BO001 Case07 Actual RTL Simulation
on:
  push:
    branches: [bo001-rtl-ci]
    paths:
      - 'bo001/**'
      - '.github/workflows/bo001-case07.yml'
  workflow_dispatch:
jobs:
  case07:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install real Icarus Verilog toolchain
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Compile and execute SystemVerilog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bo001/results
          iverilog -V > bo001/results/iverilog_version.txt 2>&1
          iverilog -g2012 -Wall -s tb_case07_v4 -o bo001/results/case07.vvp bo001/engineering/bo_mailbox_fifo_v4.sv bo001/engineering/tb_case07_v4.sv 2>&1 | tee bo001/results/compile.log
          vvp bo001/results/case07.vvp 2>&1 | tee bo001/results/simulation.log
          test "$(grep -c '^PASS occupancy=' bo001/results/simulation.log)" -eq 9
          grep -q '^PASS Case 07 v4:' bo001/results/simulation.log
          test -s case07_v4.vcd
          mv case07_v4.vcd bo001/results/case07_v4.vcd
          echo "ACTUAL RTL SIMULATION PASSED"
      - name: Independent Verilator structural RTL lint
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y verilator
          verilator --version | tee bo001/results/verilator_version.txt
          verilator --lint-only -Wall -Wno-fatal --top-module bo_mailbox_fifo_v4 bo001/engineering/bo_mailbox_fifo_v4.sv 2>&1 | tee bo001/results/verilator_lint.log
      - name: Compile and test 14 additional fault-injection mini models
        shell: bash
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall -s tb_bo001_mini14 -o bo001/results/mini14.vvp bo001/engineering/bo001_mini_models_14cases.sv bo001/engineering/tb_bo001_mini14.sv 2>&1 | tee bo001/results/mini14_compile.log
          vvp bo001/results/mini14.vvp 2>&1 | tee bo001/results/mini14_simulation.log
          test "$(grep -c '^PASS MINI C' bo001/results/mini14_simulation.log)" -eq 14
          grep -q '^PASS ALL 14 DISTINCT MINIATURE RTL DEMONSTRATIONS' bo001/results/mini14_simulation.log
          test -s bo001_mini14.vcd
          mv bo001_mini14.vcd bo001/results/bo001_mini14.vcd
      - name: Verilator lint for mini RTL models
        shell: bash
        run: |
          set -euo pipefail
          : > bo001/results/mini14_verilator_lint.log
          for top in bo_boot_vector bo_hart_release bo_reset_clock_order bo_sticky_irq bo_axi_decode bo_byte_strobes bo_apb_ready bo_w1c bo_pll_lock bo_dma_address bo_irq_enable bo_privilege bo_busy bo_dma_irq_order; do
            echo "LINT TOP: $top" | tee -a bo001/results/mini14_verilator_lint.log
            verilator --lint-only -Wno-fatal --top-module "$top" bo001/engineering/bo001_mini_models_14cases.sv 2>&1 | tee -a bo001/results/mini14_verilator_lint.log
          done
          test "$(grep -c '^LINT TOP:' bo001/results/mini14_verilator_lint.log)" -eq 14
      - name: Compile and simulate 19 additional scenario-specific RTL models
        shell: bash
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall -s tb_bo001_mini19 -o bo001/results/mini19.vvp bo001/engineering/bo001_mini_models_19more.sv bo001/engineering/tb_bo001_mini19.sv 2>&1 | tee bo001/results/mini19_compile.log
          vvp bo001/results/mini19.vvp 2>&1 | tee bo001/results/mini19_simulation.log
          test "$(grep -c '^PASS MINI C' bo001/results/mini19_simulation.log)" -eq 19
          grep -q '^PASS ALL 19 ADDITIONAL DISTINCT MINI RTL MODELS' bo001/results/mini19_simulation.log
          test -s bo001_mini19.vcd
          mv bo001_mini19.vcd bo001/results/bo001_mini19.vcd
      - name: Verilator lint all 19 more mini RTL models
        shell: bash
        run: |
          set -euo pipefail
          : > bo001/results/mini19_verilator_lint.log
          for top in bo_uart_observe bo_dram_training bo_image_bounds bo_axi_reset_outstanding bo_short_reset_capture bo_status_shadow bo_gate_outstanding bo_freq_timeout bo_isolation bo_wake_latch bo_dram_mapping bo_cache_dma bo_ecc_classify bo_arbiter bo_irq_affinity bo_auth_image bo_transactor bo_shared_reset bo_secure_transition; do
            echo "LINT TOP: $top" | tee -a bo001/results/mini19_verilator_lint.log
            verilator --lint-only -Wno-fatal --top-module "$top" bo001/engineering/bo001_mini_models_19more.sv 2>&1 | tee -a bo001/results/mini19_verilator_lint.log
          done
          test "$(grep -c '^LINT TOP:' bo001/results/mini19_verilator_lint.log)" -eq 19
      - name: Run six host, build, and evidence-oriented case checks (NOT RTL)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v bo001/verification/test_nonrtl_6cases.py 2>&1 | tee bo001/results/nonrtl_six.log
          test "$(grep -c '^test_C' bo001/results/nonrtl_six.log)" -eq 6
          grep -q '^OK        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bo001-case07-rtl-evidence
          path: bo001/results/
          if-no-files-found: warn
 bo001/results/nonrtl_six.log
      - name: Archive actual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bo001-case07-rtl-evidence
          path: bo001/results/
          if-no-files-found: warn
